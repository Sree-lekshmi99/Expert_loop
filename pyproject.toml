[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "expertloop"
version = "0.1.0"
description = "Human corrections → verified SQL datasets → reproducible model evaluations"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["fastapi==0.128.2", "uvicorn==0.48.0", "httpx==0.28.1", "pydantic==2.13.4"]

[project.optional-dependencies]
dev = ["pytest==9.0.2"]

[project.scripts]
expertloop = "expertloop.cli:main"

[tool.setuptools.packages.find]
include = ["expertloop*"]

[tool.setuptools.package-data]
expertloop = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
